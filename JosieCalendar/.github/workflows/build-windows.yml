name: Build Windows executable

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build

      # Every push/manual run: upload the .exe/.msi as a downloadable workflow artifact
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: JosieCalendar-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      # Only on version tags (e.g. v0.1.0): also publish a GitHub Release
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'JosieCalendar ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
